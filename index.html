<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob: https://cdnjs.cloudflare.com; connect-src https://cdnjs.cloudflare.com; worker-src blob: https://cdnjs.cloudflare.com; base-uri 'none'; form-action 'none'">
<script>window.KK_DEMO_ONLY = true; if (window.top !== window.self) { document.documentElement.style.display = "none"; }</script>
</head>
<body>
<title>工事資料（表示確認用デモ）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 工事資料（表示確認用デモ）Ver.0.2.1 先行実用版
   配置：iPhone＝ホーム→現場の1画面ずつ。iPad横・PC＝左に現場一覧、右に資料一覧の2ペイン。資料は全画面で開く。
   方針：白と淡いグレーが基調。色は「最新・旧版・書き込み済み・失敗」の状態と、緑のアクセントだけに使う。 */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --raise:#fbfbfa; --ink:#1b211e; --muted:#5d6762; --faint:#89928d;
  --line:#e1e4df; --sep:#eceee9; --hover:#f0f2ef; --sel:#e7f0ea;
  --accent:#2c6148; --accent-ink:#235139; --on-accent:#ffffff;
  --ok:#2b7a4b; --ok-soft:#e5f1e9; --old:#8a5a12; --old-soft:#f7eedd; --ann:#7a4f0c; --ann-soft:#f8efdc;
  --danger:#b3261e; --danger-soft:#f8e1de;
  --paper:#ffffff; --paper-ink:#2b302d; --paper-line:#59615c; --paper-faint:#a6ada8; --pen:#d2412f;
  --stage:#e8eae6; --scrim:rgba(14,18,16,.42); --toast-bg:#1b211e; --toast-ink:#f5f6f4;
  --pdf:#b3261e; --xls:#1f7a45; --doc:#2b5797; --cad:#8a5a12;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --list-w:340px; --head-h:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#181d1a; --raise:#1c221f; --ink:#e9ede9; --muted:#a3ada7; --faint:#7f8983;
  --line:#2a322e; --sep:#222925; --hover:#1f2622; --sel:#1d3328;
  --accent:#7cc39c; --accent-ink:#9fd3b6; --on-accent:#0f1512;
  --ok:#6cc391; --ok-soft:#1b3326; --old:#e2b064; --old-soft:#33291a; --ann:#e8be72; --ann-soft:#352a17;
  --danger:#f08a80; --danger-soft:#3a201d;
  --paper:#e6e8e4; --paper-ink:#232825; --paper-line:#4e5651; --paper-faint:#9aa19c; --pen:#c23a29;
  --stage:#0c0f0d; --scrim:rgba(0,0,0,.6); --toast-bg:#e9ede9; --toast-ink:#111513;
  --pdf:#f08a80; --xls:#6cc391; --doc:#8fb1ea; --cad:#e2b064;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#181d1a; --raise:#1c221f; --ink:#e9ede9; --muted:#a3ada7; --faint:#7f8983;
  --line:#2a322e; --sep:#222925; --hover:#1f2622; --sel:#1d3328;
  --accent:#7cc39c; --accent-ink:#9fd3b6; --on-accent:#0f1512;
  --ok:#6cc391; --ok-soft:#1b3326; --old:#e2b064; --old-soft:#33291a; --ann:#e8be72; --ann-soft:#352a17;
  --danger:#f08a80; --danger-soft:#3a201d;
  --paper:#e6e8e4; --paper-ink:#232825; --paper-line:#4e5651; --paper-faint:#9aa19c; --pen:#c23a29;
  --stage:#0c0f0d; --scrim:rgba(0,0,0,.6); --toast-bg:#e9ede9; --toast-ink:#111513;
  --pdf:#f08a80; --xls:#6cc391; --doc:#8fb1ea; --cad:#e2b064;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 枠 ---------- */
.listpane,.mainpane{min-width:0}
.mainpane{display:none}
body.v-site .listpane{display:none}
body.v-site .mainpane{display:block}
@media (min-width:1000px){
  .app{display:grid;grid-template-columns:var(--list-w) minmax(0,1fr);height:100vh;height:100dvh}
  .listpane,.mainpane{display:block!important;overflow-y:auto;height:100%}
  .listpane{border-right:1px solid var(--line);background:var(--surface)}
  .backbtn:not(.vback){display:none!important}
}

/* ---------- ヘッダー（社名＋検索を1行に） ---------- */
.lhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;height:var(--head-h)}
.brand{flex:none;display:flex;flex-direction:column;line-height:1.1}
.brand small{font-size:10px;letter-spacing:.16em;color:var(--faint)}
.brand b{font-size:15px;letter-spacing:.06em;color:var(--accent-ink)}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 34px 0 33px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search .clr{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.ibtn{flex:none;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover,.ibtn:active{background:var(--hover);color:var(--ink)}
.modetag{font-size:10.5px;font-weight:700;color:var(--old);background:var(--old-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}

/* ---------- ホーム ---------- */
.recentbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px 2px}
.recentbar::-webkit-scrollbar{display:none}
.rchip{flex:none;max-width:200px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center}
.rchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip.sel{border-color:var(--accent);background:var(--sel);color:var(--accent-ink)}
.lbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 4px}
.lbar h2{margin:0;font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.08em}
.tbtn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.tbtn:hover,.tbtn:active{background:var(--hover)}
.tbtn svg{width:17px;height:17px}
.tbtn.solid{background:var(--accent);color:var(--on-accent)}
.slist{display:flex;flex-direction:column;padding-bottom:40px}
.srow{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:7px;border-bottom:1px solid var(--sep);width:100%}
.srow:hover{background:var(--hover)}
.srow .m{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .n{font-size:16px;font-weight:650;font-weight:600;line-height:1.35}
.srow .s{font-size:12px;color:var(--faint);line-height:1.4}
.srow.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.srow .chev{color:var(--faint);width:16px;height:16px}
.listpane .slist .srow{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:12px}
.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
mark{background:var(--old-soft);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- 現場 ---------- */
.mhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
@media (min-width:1000px){.mhead{top:0}}
.mtop{display:flex;align-items:center;gap:4px;min-height:var(--head-h);padding-block:6px}
.backbtn{flex:none;display:flex;align-items:center;width:36px;height:36px;margin-left:-8px;justify-content:center;color:var(--accent-ink);border-radius:9px}
.backbtn:hover{background:var(--hover)}
.stitle{flex:1;min-width:0}
.stitle h1{margin:0;font-size:19px;font-weight:700;line-height:1.3;letter-spacing:.01em}
.stitle p{margin:0;font-size:12px;color:var(--faint)}
/* 4分類：枠のある独立したボタン。選択中は塗りつぶし。下段の「種類」の絞り込みとは見た目の階層を分ける */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-block:2px 10px}
.cat{min-width:0;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px}
.cat .nm{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:700;line-height:1.25;white-space:nowrap;color:var(--ink)}
.cat .nm svg{width:16px;height:16px;color:var(--muted)}
.cat .c{font-size:11px;font-weight:600;line-height:1.25;color:var(--faint)}
.cat:hover{border-color:var(--faint)}
.cat.sel{background:var(--accent);border-color:var(--accent)}
.cat.sel .nm,.cat.sel .nm svg,.cat.sel .c{color:var(--on-accent)}
@media (max-width:440px){.cat .nm svg{display:none}.cat .nm{font-size:14px}}
@media (max-width:350px){.cat .nm{font-size:12.5px}}
.pj{font-size:12px;color:var(--muted)}
button.pj{display:inline-flex;align-items:center;gap:2px;height:26px;margin-top:2px;padding:0 6px 0 9px;border-radius:13px;border:1px solid var(--line);background:var(--bg);font-weight:700;color:var(--accent-ink);max-width:100%}
button.pj span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.pj svg{width:14px;height:14px;transform:rotate(90deg)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.mbody{padding-block:8px 60px;max-width:900px}
.subs{display:flex;align-items:center;gap:2px;padding-block:0 8px;overflow-x:auto;scrollbar-width:none}
.subs .sl{flex:none;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin-right:6px}
.chip{flex:none;height:30px;padding:0 11px;border-radius:15px;font-size:13px;color:var(--muted)}
.chip.sel{background:var(--sel);color:var(--accent-ink);font-weight:700}
/* メモ写真 */
.memobar{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:0 0 10px}
.mbtn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:700}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.thumb{flex:none;width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.thumb.has svg{display:none}
.pendbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--old-soft);color:var(--old);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px;font-weight:700}
.pendbar span{flex:1 1 180px}
.pendbar button{height:32px;padding:0 12px;border-radius:8px;border:1px solid currentColor;font-size:13px;font-weight:700}
.listpane .pendbar{margin:8px 0 0}
.mprev{display:block;max-width:100%;max-height:40vh;margin:0 auto 12px;border-radius:8px;border:1px solid var(--line)}
.dest{font-size:13px;font-weight:700;background:var(--sel);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 12px}
.plist{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.plist button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);font-size:15px;font-weight:700;text-align:left}
.plist button.sel{border-color:var(--accent);background:var(--sel);color:var(--accent-ink)}
.plist small{flex:none;font-weight:500;font-size:12px;color:var(--faint)}
.cand{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:8px;border:1px solid var(--line)}
.cand .m{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;font-weight:700;line-height:1.35}
.cand small{font-size:12px;font-weight:500;color:var(--faint)}
.cbtn{flex:none;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700}
.cbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dlist{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.series+.series{border-top:1px solid var(--sep)}
.drow{display:flex;align-items:center;min-height:56px}
.drow:hover{background:var(--hover)}
.drow .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 0 8px 12px;align-self:stretch}
.ft{flex:none;width:34px;height:20px;border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;border:1px solid currentColor;opacity:.9}
.ft.img{color:var(--accent-ink)} .ft.pdf{color:var(--pdf)} .ft.xlsx,.ft.xls,.ft.csv{color:var(--xls)} .ft.docx,.ft.doc{color:var(--doc)} .ft.dwg,.ft.jww,.ft.dxf{color:var(--cad)} .ft.other{color:var(--faint)}
.dm{flex:1;min-width:0;display:flex;flex-direction:column}
.dt{font-size:15.5px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--faint);line-height:1.5;margin-top:1px}
.dmeta .dot::before{content:"・"}
.st{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.st.new{background:var(--ok-soft);color:var(--ok)}
.st.old{background:var(--old-soft);color:var(--old)}
.st.ann{background:var(--ann-soft);color:var(--ann)}
.kebab{flex:none;width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.kebab:hover{background:var(--sep);color:var(--ink)}
.morebtn{display:flex;align-items:center;gap:4px;width:100%;min-height:36px;padding:0 12px 0 56px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--sep)}
.morebtn svg{width:14px;height:14px;transition:transform .15s}
.morebtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.older{background:var(--raise);border-top:1px solid var(--sep)}
.older .drow{min-height:48px}
.older .drow .open{padding-left:28px}
.older .dt{font-size:14px;font-weight:500;color:var(--muted);-webkit-line-clamp:1}
.older .grp{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.06em;padding:8px 12px 0 28px}
.dropzone{margin-top:12px;border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--faint);font-size:13px;display:none}
@media (hover:hover) and (pointer:fine){.dropzone{display:block}}
.loading{padding:30px 0;text-align:center;color:var(--muted);font-size:14px}
.placeholder{display:none}
@media (min-width:1000px){.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;color:var(--muted);text-align:center;padding:40px;font-size:14px}.placeholder b{font-size:18px;color:var(--ink)}}
.path{font-family:var(--mono);font-size:11.5px;color:var(--faint);word-break:break-all}

/* ---------- 資料ビューア ---------- */
.viewer{position:fixed;inset:0;z-index:40;background:var(--stage);display:flex;flex-direction:column}
.vbar{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.vbar .in{display:flex;align-items:center;gap:6px;min-height:50px}
.vtitle{flex:1;min-width:0}
.vtitle b{display:block;font-size:15.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;align-items:center;background:var(--bg);border-radius:9px;border:1px solid var(--line)}
.zoom button{width:38px;height:36px;display:flex;align-items:center;justify-content:center}
.zoom .zv{width:auto;min-width:48px;padding:0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.vstate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:6px;font-size:13px;font-weight:700;min-height:36px}
.vstate svg{width:17px;height:17px}
.vstate>span:not(.sp){flex:1 1 200px;min-width:0}
.vstate.ok{background:var(--ok-soft);color:var(--ok)}
.vstate.old{background:var(--danger-soft);color:var(--danger)}
.vstate.ann{background:var(--ann-soft);color:var(--ann)}
.vstate button{height:30px;padding:0 10px;border-radius:7px;background:var(--danger);color:#fff;font-size:12.5px}
:root[data-theme="dark"] .vstate button{color:#1b0f0e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vstate button{color:#1b0f0e}}
.vmain{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.stage .pad{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:min-content}
.paper{background:var(--paper);box-shadow:0 2px 12px rgba(0,0,0,.16);position:relative;flex:none}
.paper svg,.paper canvas,.paper img{display:block;width:100%;height:auto}
.stamp{position:absolute;top:6%;left:5%;border:3px solid var(--danger);color:var(--danger);font-weight:900;font-size:clamp(18px,3.4vw,38px);padding:0 12px;border-radius:6px;transform:rotate(-8deg);letter-spacing:.2em;background:rgba(255,255,255,.6);pointer-events:none}
.filecard{margin:40px auto;max-width:420px;background:var(--surface);border-radius:12px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.filecard .ft{width:52px;height:30px;font-size:12px}
.vside{width:320px;flex:none;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding-block:16px 30px;display:none}
@media (min-width:900px){.vside{display:block}.vfoot{display:none!important}}
.vside h3{margin:0 0 2px;font-size:17px;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:10px 0 14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;min-width:0}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:9px;background:var(--bg);font-size:14px;font-weight:600;width:100%;border:1px solid var(--line)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* 共有メニュー（Web Share API）。HTTPSのページで、押した直後でないと開かないため、PDFは資料を開いた時点で読み込んでおく */
function demoPdf(title) {
  var content = '0.6 w 40 40 1110 762 re S\n1 w 80 120 m 560 120 l 560 600 l 80 600 l h S 320 120 m 320 420 l S\nBT /F1 22 Tf 620 700 Td (' + title.replace(/[^\x20-\x7e]/g, '').replace(/[()\\]/g, '') + ') Tj ET\nBT /F1 14 Tf 620 670 Td (Demo PDF. Not a real drawing.) Tj ET\n';

  var out = '%PDF-1.4\n', offs = [], i; for (i = 1; i < objs.length; i++) { offs[i] = out.length; out += i + ' 0 obj\n' + objs[i] + '\nendobj\n'; }

var pending = null;

}

    '<div class="field"><span class="lbl">分類</span><div class="seg c4">' + CATS.map(function (x) { return '<button data-addcat="' + x.key + '" class="' + (x.key === p.cat ? 'sel' : '') + '"' + lock + '>' + esc(x.name) + '</button>'; }).join('') + '</div></div>' +
    '<div class="field"><span class="lbl">ファイル（' + p.files.length + '件）</span>' + p.files.map(function (f, i) {
      var t = f.target !== 'new' ? doc(f.target) : null, nv = t ? t.v + 1 : 1, l = running || f.status === 'ok' ? ' disabled' : '';
      var st = f.status === 'run' ? '<span class="fs run"><span class="spin"></span> ' + Math.round((f.prog || 0) * 100) + '%</span>' : f.status === 'ok' ? '<span class="fs ok">保存済み</span>' : f.status === 'err' ? '<span class="fs err">未保存</span>' : '';
      return '<div class="frow"><span class="ft ' + ftClass(f.fmt) + '">' + ftTag(f.fmt) + '</span><div class="m">' +

        (f.target === 'new' ? '<select id="add-sub-' + i + '" data-fsub="' + i + '" aria-label="区分"' + l + '>' + c.subs.map(function (sb) { return '<option' + (sb === f.sub ? ' selected' : '') + '>' + esc(sb) + '</option>'; }).join('') + '</select>' : '') +
        '<span class="path">' + esc(c.folder + '/' + (f.target === 'new' && f.sub === MEMO ? cleanName(f.title || '無題') + '_' + ymd(today()) + '-' + hm().replace(':', '') : cleanName(f.title || '無題') + '_第' + nv + '版_' + ymd(today())) + '.' + f.fmt) + '（' + kb(f.file.size) + '）' + (t ? '　第' + t.v + '版は「' + OLD_DIR + '」へ移して残します' : '') + '</span>' +

function addSave() {
  var p = pending, todo = p.files.filter(function (f) { return f.status !== 'ok'; });

  todo.forEach(function (f) { f.status = 'run'; f.prog = 0; f.msg = ''; }); renderAdd();

/* ================= メモ写真 =================
   流れ：その他 → メモを撮る → 撮影 → 保存。写真は保存が確認できるまで端末（IndexedDB）に残し、失敗しても消さない。
   uid（送信ID）は写真ごとに1つ。もう一度保存しても、Drive側で同じ uid の資料があれば二重に作らない。 */
var PENDING = [], memq = { db: null, mem: [] };
function idb() {
  return new Promise(function (res, rej) {
    if (memq.db) { res(memq.db); return; }
    try { var r = indexedDB.open('kk-docs', 1); r.onupgradeneeded = function () { r.result.createObjectStore('memos', { keyPath: 'uid' }); }; r.onsuccess = function () { memq.db = r.result; res(memq.db); }; r.onerror = function () { rej(r.error); }; } catch (e) { rej(e); }
  });
}
function idbDo(mode, fn) { return idb().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction('memos', mode), st = tx.objectStore('memos'), out = fn(st); tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : true); }; tx.onerror = function () { rej(tx.error); }; }); }); }
function mqKeep(r) { return { uid: r.uid, siteId: r.siteId, projectId: r.projectId, title: r.title, at: r.at, ext: r.ext, type: r.type, conv: r.conv, blob: r.blob, err: r.err || '' }; }
function mqAll() { return idbDo('readonly', function (st) { return st.getAll(); }).then(function (x) { return x || []; }, function () { return memq.mem.slice(); }); }
function mqPut(r) { memq.mem = memq.mem.filter(function (x) { return x.uid !== r.uid; }).concat([mqKeep(r)]); return idbDo('readwrite', function (st) { st.put(mqKeep(r)); }).then(function () { return true; }, function () { return false; }); }
function mqDel(uid) { memq.mem = memq.mem.filter(function (x) { return x.uid !== uid; }); return idbDo('readwrite', function (st) { st.delete(uid); }).then(function () { return true; }, function () { return false; }); }
function refreshPending() { return mqAll().then(function (list) { var before = PENDING.length; PENDING = list.filter(function (r) { return r.blob; }).sort(function (a, b) { return a.at < b.at ? -1 : 1; }); if (before !== PENDING.length) render(); }); }
function pendBar(n) { return '<div class="pendbar" role="status">' + ic('warn') + '<span>保存されていないメモが ' + n + '件あります（この端末に残っています）</span><button data-act="pending">確認して保存</button></div>'; }
function defaultMemoTitle(at) { var d = new Date(at); return '打合せメモ_' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }

/* 写真を JPEG にそろえる：向きを正しくし、長い辺を2400pxまでに縮める（文字が読める大きさ）。
   HEIC などで変換できないときは、元のファイルのまま保存する（失敗として捨てない） */
function prepImage(file) {
  return new Promise(function (res) {
    var url, img = new Image(), done = function (r) { try { URL.revokeObjectURL(url); } catch (e) {} res(r); };
    var keep = function (why) { done({ blob: file, conv: false, why: why, ext: extOf(file.name) || 'jpg', type: file.type || 'application/octet-stream' }); };
    try { url = URL.createObjectURL(file); } catch (e) { keep('読み込めませんでした'); return; }
    img.onload = function () {
      try {
        var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 2400 / Math.max(w, h)), cv = document.createElement('canvas');
        if (!w || !h) { keep('大きさがわかりませんでした'); return; }
        cv.width = Math.round(w * sc); cv.height = Math.round(h * sc); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { if (b && b.size) done({ blob: b, conv: true, ext: 'jpg', type: 'image/jpeg', w: cv.width, h: cv.height }); else keep('JPEGに変換できませんでした'); }, 'image/jpeg', 0.85);
      } catch (e) { keep('JPEGに変換できませんでした'); }
    };
    img.onerror = function () { keep('この端末では画像を読み込めませんでした'); };
    img.src = url;
  });
}
function memoStart(file) {
  if (!file) return;
  if (!state.siteId || !project(state.projectId)) { toast('先に現場を開いてください', true); return; }
  var rec = { uid: uuid(), siteId: state.siteId, projectId: state.projectId, title: '', at: new Date().toISOString() };
  sheet('<h2>メモを保存</h2><div class="pdfmsg"><span class="spin"></span> 写真を準備中</div>');
  prepImage(file).then(function (r) {
    rec.blob = r.blob; rec.conv = r.conv; rec.ext = r.ext; rec.type = r.type; rec.why = r.why || '';
    return mqPut(rec).then(function (ok) { rec.durable = ok; refreshPending(); memoSheet(rec); });
  });
}
function memoSheet(rec, extra) {
  var s = site(rec.siteId), p = project(rec.projectId), dt = defaultMemoTitle(rec.at);
  if (!rec._url) { try { rec._url = URL.createObjectURL(rec.blob); } catch (e) { rec._url = ''; } }
  sheet('<h2>メモを保存</h2><div class="dest">保存先：' + esc(s ? s.name : '（現場が見つかりません）') + '／' + esc(p ? p.name : '') + '／その他・メモ</div>' +
    (rec.conv === false ? '<div class="note warn">この写真はJPEGに変換できなかったため、元の形式（' + esc(String(rec.ext).toUpperCase()) + '）のまま保存します。パソコンでは表示できない場合があります。</div>' : '') +
    (rec._url ? '<img class="mprev" src="' + rec._url + '" alt="撮影したメモ">' : '') +
    '<div class="field"><label for="memo-title">タイトル（空欄なら「' + esc(dt) + '」）</label><input type="text" id="memo-title" value="' + esc(rec.title || '') + '" placeholder="' + esc(dt) + '" enterkeyhint="done"></div>' +
    (rec.durable === false ? '<div class="note warn">この端末に一時保存できませんでした。保存が終わるまで画面を閉じないでください。</div>' : '') + (extra || '') +
    '<div class="btns"><button class="btn" data-act="memo-later">あとで保存</button><button class="btn primary" data-act="memo-save"' + (s && p ? '' : ' disabled') + '>' + (rec.err ? 'もう一度保存' : '保存する') + '</button></div>' +
    '<p class="lead" style="margin-top:8px;font-size:12px">保存が確認できるまで、写真はこの端末にも残します。</p>', function () { if (!rec.saved) { refreshPending(); if (rec.durable !== false) toast('写真はこの端末に残しています。あとで保存できます'); } });
  var im = $('#overlay .mprev'); if (im) im.addEventListener('error', function () { im.style.display = 'none'; });
  $('#overlay')._memo = rec;
}
function memoSave() {
  var rec = $('#overlay')._memo; if (!rec || rec.busy) return;
  var t = $('#memo-title'); rec.title = cleanName(t ? t.value : rec.title || ''); var title = rec.title || defaultMemoTitle(rec.at);
  rec.busy = true; mqPut(rec); busyBtn('[data-act=memo-save]', '保存中…');
  var file; try { file = new File([rec.blob], cleanName(title) + '.' + rec.ext, { type: rec.type }); } catch (e) { file = rec.blob; file.name = cleanName(title) + '.' + rec.ext; }
  API.upload({ siteId: rec.siteId, projectId: rec.projectId, cat: 'meeting', sub: MEMO, series: title, sid: null, kind: 'original', uid: rec.uid }, file)
    .then(function () {
      rec.saved = true; return mqDel(rec.uid).then(function () {
        if (rec._url) URL.revokeObjectURL(rec._url); closeSheet(); refreshPending();
        if (state.siteId === rec.siteId) { state.projectId = rec.projectId; state.cat = 'meeting'; state.sub = MEMO; }
        render(); toast(API === Gas ? 'メモを保存しました（Driveで確認済み）' : 'メモを保存しました');
      });
    })
    .catch(function (e) { rec.busy = false; rec.err = e.message; mqPut(rec); memoSheet(rec, '<div class="note err">保存できませんでした。写真はこの端末に残っています。<br>' + esc(e.message) + '</div>'); });
}
function pendingSheet() {
  sheet('<h2>保存されていないメモ</h2><p class="lead">この端末に残っている写真です。保存するか、いらなければ破棄してください。</p><div class="plist">' + PENDING.map(function (r) {
    var s = site(r.siteId), p = project(r.projectId), d = new Date(r.at);
    return '<div class="cand"><span class="m"><span class="ell">' + esc(r.title || defaultMemoTitle(r.at)) + '</span><small>' + esc(s ? s.name : '現場不明') + (p ? '／' + esc(p.name) : '') + '・' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm(d) + (r.err ? '・前回：' + esc(r.err) : '') + '</small></span>' +
      '<button class="cbtn" data-pdel="' + r.uid + '">破棄</button><button class="cbtn pri" data-pend="' + r.uid + '">保存へ</button></div>';
  }).join('') + '</div><div class="btns"><button class="btn" data-act="close">閉じる</button></div>');

function pendDelSheet(uid) {
  var r = PENDING.filter(function (x) { return x.uid === uid; })[0]; if (!r) return;
  sheet('<h2>この写真を破棄しますか</h2><p class="lead">' + esc(r.title || defaultMemoTitle(r.at)) + '</p><div class="note warn">まだDriveに保存されていません。破棄すると元に戻せません。</div>' +
    '<label class="check"><input type="checkbox" id="pdelok"> 破棄してよいことを確認しました</label><div class="btns"><button class="btn" data-act="pending">戻る</button><button class="btn danger" data-act="pdel-ok" disabled>破棄する</button></div>');

/* ================= ドラッグ＆ドロップ ================= */
var dragDepth = 0;
function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
document.addEventListener('dragenter', function (e) {
  if (!hasFiles(e) || !$('#overlay').hidden || !state.siteId) return; e.preventDefault(); dragDepth++;
  var ov = $('#dropov'); if (!ov.hidden) return;
  ov.innerHTML = '<div class="dropbox"><h2>' + esc(site(state.siteId).name) + ' に追加</h2><p>入れる分類の上で離してください。保存の前に名前と版を確認できます。</p><div class="dropgrid">' + CATS.map(function (c) { return '<div class="dt-target" data-dropcat="' + c.key + '">' + esc(c.name) + '<small>' + esc(c.folder) + '</small></div>'; }).join('') + '</div></div>';
  ov.hidden = false;
});
document.addEventListener('dragover', function (e) { if (!hasFiles(e) || $('#dropov').hidden) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; var t = e.target.closest && e.target.closest('[data-dropcat]'); Array.prototype.forEach.call(document.querySelectorAll('[data-dropcat]'), function (x) { x.classList.toggle('over', x === t); }); });
document.addEventListener('dragleave', function (e) { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropov').hidden = true; });
document.addEventListener('drop', function (e) {
  if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; var ov = $('#dropov'); if (ov.hidden) return; ov.hidden = true;
  var t = e.target.closest && e.target.closest('[data-dropcat]'), cat = t ? t.getAttribute('data-dropcat') : state.cat; state.cat = cat; state.sub = null; render(); startAdd(e.dataTransfer.files, state.siteId, cat);
});

/* ================= 操作 ================= */
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { state.q = t.value; var pos = t.selectionStart; renderList(); var q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) {} return; }
  if (t.hasAttribute('data-ftitle')) pending.files[+t.getAttribute('data-ftitle')].title = t.value;
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'filepick') { startAdd(t.files); t.value = ''; return; }
  if (t.id === 'annpick') { if (t.files[0]) annAdd(t.files[0]); t.value = ''; return; }
  if (t.hasAttribute('data-ftarget')) { pending.files[+t.getAttribute('data-ftarget')].target = t.value; renderAdd(); return; }
  if (t.hasAttribute('data-fsub')) { pending.files[+t.getAttribute('data-fsub')].sub = t.value; return; }
  if (t.hasAttribute('data-ftitle')) { renderAdd(); return; }
  if (t.id === 'delok') { $('#overlay [data-act=dodelete]').disabled = !t.checked; return; }
  if (t.id === 'pdelok') { $('#overlay [data-act=pdel-ok]').disabled = !t.checked; return; }
  if (t.id === 'memocam' || t.id === 'memopick') { var mf = t.files && t.files[0]; t.value = ''; memoStart(mf); return; }
  if (t.id === 'mv-site') { moveSheet(t.value, null, $('#mv-cat').value); return; }
  if (t.id === 'demofail') demoFail = t.checked;
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!$('#overlay').hidden) { if (!$('#overlay .spin')) closeSheet(); } else if (state.docId) closeDoc(); } });
document.addEventListener('click', function (e) {
  var t = e.target.closest('button,.scrim'); if (!t) return;
  if (t.classList.contains('scrim')) { if (e.target === t && !t.querySelector('.spin')) closeSheet(); return; }
  if (t.disabled) return;
  var a;
  if ((a = t.getAttribute('data-site'))) { closeSheet(); openSite(a); return; }
  if ((a = t.getAttribute('data-proj'))) { closeSheet(); selectProject(a); return; }
  if ((a = t.getAttribute('data-addproj'))) { var pn = $('#ns-proj') ? $('#ns-proj').value.trim() : ''; closeSheet(); addProjectSheet(a, pn); return; }
  if ((a = t.getAttribute('data-pend'))) { var pr = PENDING.filter(function (x) { return x.uid === a; })[0]; closeSheet(); if (pr) { pr.durable = true; memoSheet(pr); } return; }
  if ((a = t.getAttribute('data-pdel'))) { closeSheet(); pendDelSheet(a); return; }
  if ((a = t.getAttribute('data-cat'))) { state.cat = a; state.sub = null; renderMain(); return; }
  if ((a = t.getAttribute('data-sub'))) { state.sub = a === 'すべて' ? null : a; renderMain(); return; }
  if ((a = t.getAttribute('data-toggle'))) { state.open[a] = !state.open[a]; renderMain(); return; }
  if ((a = t.getAttribute('data-doc'))) { closeSheet(); openDoc(a); prepareShare(doc(a)); return; }
  if ((a = t.getAttribute('data-manage'))) { manage(a); return; }
  if ((a = t.getAttribute('data-zoom'))) { if (a === '0') { state.zoom = 0; applyZoom(); } else setZoom((state.zoom || 1) * (a === '1' ? 1.4 : 1 / 1.4)); return; }
  if ((a = t.getAttribute('data-addcat'))) { pending.cat = a; pending.files.forEach(guessTarget); renderAdd(); return; }
  if ((a = t.getAttribute('data-theme'))) { setTheme(a); Array.prototype.forEach.call(document.querySelectorAll('#overlay [data-theme]'), function (b) { b.classList.toggle('sel', b.getAttribute('data-theme') === a); }); return; }
  switch (t.getAttribute('data-act')) {
    case 'home': state.view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'clearq': state.q = ''; renderList(); $('#q').focus(); break;
    case 'add': $('#filepick').click(); break;
    case 'newsite': newSiteSheet(state.q.trim()); break;
    case 'projects': projectsSheet(); break;
    case 'addproj-save': saveProject(); break;
    case 'memo-cam': $('#memocam').click(); break;
    case 'memo-pick': $('#memopick').click(); break;
    case 'memo-save': memoSave(); break;
    case 'memo-later': closeSheet(); break;
    case 'pending': closeSheet(); pendingSheet(); break;
    case 'pdel-ok': var pu = $('#overlay')._pdel; mqDel(pu).then(function () { closeSheet(); refreshPending().then(function () { toast('写真を破棄しました'); if (PENDING.length) pendingSheet(); }); }); break;
    case 'newsite-save': saveSite(false); break;
    case 'newsite-force': saveSite(true); break;
    case 'settings': settingsSheet(); break;
    case 'connect': doConnect(); break;
    case 'disconnect': ls(CONN_KEY, null); conn = null; API = Demo; closeSheet(); boot(); toast('デモに戻しました'); break;
    case 'close': closeSheet(); break;
    case 'closedoc': closeDoc(); break;
    case 'goodnotes': goodnotes(); break;
    case 'tolatest': closeSheet(); openDoc(latestOf(doc(state.docId)).id); break;
    case 'doshare': doShare(); break;
    case 'share': shareSheet(); break;
    case 'docmenu': docMenu(); break;
    case 'download': download(); break;
    case 'opendrive': openDrive(); break;
    case 'drive-folder': var s = site(state.siteId); if (s && s.folderId && API === Gas) window.open('https://drive.google.com/drive/folders/' + encodeURIComponent(s.folderId), '_blank', 'noopener'); else toast('デモでは開けません。Drive接続後はこの現場のフォルダを開きます'); break;
    case 'annadd': closeSheet(); $('#annpick').click(); break;
    case 'annsave': annSave(); break;
    case 'addsave': addSave(); break;
    case 'addclose': var p = pending; closeSheet(); if (p) { state.siteId = p.siteId; state.projectId = p.projectId; state.cat = p.cat; state.sub = null; state.view = 'site'; render(); } break;
    case 'rename': renameSheet(); break;
    case 'dorename': doRename(); break;
    case 'move': moveSheet(); break;
    case 'domove': doMove(); break;
    case 'delete': deleteSheet(); break;
    case 'dodelete': doDelete(); break;
  }
});

/* ================= 起動 ================= */
function boot() {
  SITES = []; PROJECTS = []; DOCS = []; loaded = {}; THUMBS = {}; state.err = null;
  if (API === Demo) { demoData(); if (!recent.length) recent = [SITES[0].id, SITES[1].id, SITES[7].id]; }
